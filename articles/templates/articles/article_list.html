{% extends 'base_layout.html' %}

{% block content %}
    <h1>Article List</h1>
        {% for article in articles %}
        <ul class="article-list"></ul>
            <li>
                <h2><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h2>
                <!-- <p>{{ article.body }}</p> -->
                <p>{{ article.snippet }}</p>
                <p>{{ article.date }}</p>
            </li>
        </ul>
        {% endfor %}
        {% endblock %}
